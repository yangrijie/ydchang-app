name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'buildozer.spec'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK with kivy/buildozer Docker
      run: |
        # kivy/buildozer 镜像以 user(uid=1000) 运行 buildozer,不能用 root
        # 将工作目录权限赋给 1000,确保容器内可写入
        sudo chown -R 1000:1000 .
        docker run --rm \
          --user 1000:1000 \
          -v "$PWD":/home/user/hostcwd \
          -w /home/user/hostcwd \
          kivy/buildozer:latest \
          bash -c "cd /home/user/hostcwd && buildozer android debug"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ydchang-app-debug-apk
        path: bin/*.apk
        if-no-files-found: warn
