name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'buildozer.spec'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK with kivy/buildozer Docker
      run: |
        # 以 root 运行容器 (buildozer.spec 中 warn_on_root=0)
        docker run --rm \
          -v "$PWD":/home/user/hostcwd \
          -w /home/user/hostcwd \
          kivy/buildozer:latest \
          bash -c "cd /home/user/hostcwd && buildozer android debug"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ydchang-app-debug-apk
        path: bin/*.apk
        if-no-files-found: warn
