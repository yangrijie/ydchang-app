name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.py'
      - 'buildozer.spec'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build APK with kivy/buildozer Docker
      run: |
        # 将构建脚本写入临时文件,避免引号嵌套问题
        cat > /tmp/build.sh << 'SCRIPT'
        set -e
        # buildozer 以 root 运行,SDK 默认在 /root/.buildozer/...
        export ANDROID_SDK_ROOT=/root/.buildozer/android/platform/android-sdk
        export ANDROIDSDK=$ANDROID_SDK_ROOT
        mkdir -p $ANDROID_SDK_ROOT
        cd /tmp
        python3 -c "import urllib.request; urllib.request.urlretrieve('https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip', 'cmdline.zip')"
        unzip -q cmdline.zip
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        rm -rf $ANDROID_SDK_ROOT/cmdline-tools/latest
        mv cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
        export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses >/dev/null 2>&1 || true
        sdkmanager "build-tools;33.0.0" "platforms;android-33" "platform-tools"
        ln -sfn $ANDROID_SDK_ROOT/cmdline-tools/latest $ANDROID_SDK_ROOT/tools
        # 降级 pip 到兼容 Python 3.14 的版本 (避免 BuildDependencyInstallError)
        pip install "pip==24.3.1" 2>/dev/null || true
        cd /home/user/hostcwd
        buildozer android debug
        SCRIPT
        docker run --rm \
          -v "$PWD":/home/user/hostcwd \
          -v /tmp/build.sh:/tmp/build.sh:ro \
          --entrypoint="" \
          kivy/buildozer:latest \
          bash /tmp/build.sh

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ydchang-app-debug-apk
        path: bin/*.apk
        if-no-files-found: warn
